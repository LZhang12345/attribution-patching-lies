<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
  <title id="title">From attribution patching to an HVP correction</title>
  <desc id="desc">For one isolated activation intervention, compute the first-order term, use an HVP for directional curvature, and add the quadratic correction. MS-HVP repeats this on smaller path segments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b0bdd0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1438" height="348" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="720" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#23364c">One isolated intervention, from clean to corrupt</text>
    <rect x="28" y="68" width="424" height="208" rx="16" fill="#fff" stroke="#d9e2ef"/>
    <rect x="508" y="68" width="424" height="208" rx="16" fill="#fff" stroke="#d9e2ef"/>
    <rect x="988" y="68" width="424" height="208" rx="16" fill="#effaf6" stroke="#c5e7da"/>
    <path d="M462 174 H495" stroke="#b0bdd0" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M942 174 H975" stroke="#b0bdd0" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="50" y="90" width="29" height="29" rx="9" fill="#eaf1fd"/>
    <text x="64" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#3b6cc4">1</text>
    <text x="91" y="111" font-size="17" font-weight="700" fill="#294568">Estimate with AtP</text>
    <text x="240" y="181" text-anchor="middle" font-size="29" fill="#23364c">g = ∇M(a)ᵀδ</text>
    <text x="240" y="230" text-anchor="middle" font-size="16" fill="#63768b">Keep the local gradient term.</text>
    <rect x="530" y="90" width="29" height="29" rx="9" fill="#efedfc"/>
    <text x="544" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#7d64c5">2</text>
    <text x="571" y="111" font-size="17" font-weight="700" fill="#534679">Compute directional curvature</text>
    <text x="720" y="181" text-anchor="middle" font-size="29" fill="#23364c">c = δᵀ(Hδ) / 2</text>
    <text x="720" y="230" text-anchor="middle" font-size="16" fill="#63768b">Use an HVP; no Hessian matrix.</text>
    <rect x="1010" y="90" width="29" height="29" rx="9" fill="#d6efe4"/>
    <text x="1024" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#237c61">3</text>
    <text x="1051" y="111" font-size="17" font-weight="700" fill="#27654f">Correct the estimate</text>
    <text x="1200" y="181" text-anchor="middle" font-size="29" fill="#23364c">Δ̂ = g + c</text>
    <text x="1200" y="230" text-anchor="middle" font-size="16" fill="#4e7d6c">Include the leading quadratic term.</text>
    <text x="720" y="316" text-anchor="middle" font-size="16" fill="#63768b">MS-HVP applies the same local correction across K smaller path segments.</text>
  </g>
</svg>
