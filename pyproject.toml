[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvp-patching"
version = "0.1.0"
description = "Matrix-free second-order corrections for attribution patching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Luyang Zhang"},
  {name = "Jialu Wang"},
]
dependencies = ["torch>=2.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
models = ["transformers>=4.45,<6", "safetensors>=0.4"]
plots = ["matplotlib>=3.8", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Paper = "https://arxiv.org/abs/2606.09899"
Repository = "https://github.com/LZhang12345/attribution-patching-lies"
Issues = "https://github.com/LZhang12345/attribution-patching-lies/issues"

[project.scripts]
hvp-patching = "hvp_patching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
